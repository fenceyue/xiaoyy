    <h1>第一章 老门东的美食地图</h1>

    <h2 id="section1">第一节 鸭血粉丝汤</h2>
    <p>南京人的一天，大多是从一碗鸭血粉丝汤开始的。老门东巷口那家店，清晨六点就开始排队。</p>
    <p>汤头要用老鸭熬足三个小时，鸭血才嫩而不散，粉丝烫八秒就得起锅。</p>
    <p>最后配一勺辣油，是本地人和游客的分界线。</p>

    <h2 id="section2">第二节 必吃清单</h2>
    <ul>
        <li>小郑酥烧饼：出炉即空，要赶早</li>
        <li>蒋有记锅贴：面皮筋足，配牛肉汤</li>
    </ul>
